<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三人炸飞机</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            padding: 20px;
            color: white;
        }
        .box {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            color: #333;
        }
        h1 { text-align: center; color: #4a5568; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:hover { background: #3182ce; }
        .btn-green { background: #48bb78; }
        .btn-green:hover { background: #38a169; }
        .room-code {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #48bb78;
            letter-spacing: 10px;
            margin: 20px 0;
        }
        .hidden { display: none; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
        }
        .player-item {
            padding: 15px;
            background: #f7fafc;
            margin: 5px 0;
            border-radius: 10px;
            border-left: 5px solid #48bb78;
        }
        .player-empty {
            padding: 15px;
            background: #f7fafc;
            margin: 5px 0;
            border-radius: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✈️ 三人炸飞机</h1>
        
        <!-- 主菜单 -->
        <div id="menu">
            <button class="btn btn-green" onclick="createRoom()">创建房间</button>
            <button class="btn" onclick="showJoin()">加入房间</button>
        </div>
        
        <!-- 加入房间界面 -->
        <div id="joinPage" class="hidden">
            <h2 style="text-align: center;">加入房间</h2>
            <input type="text" id="roomCodeInput" placeholder="输入6位房间号" maxlength="6">
            <button class="btn btn-green" onclick="joinRoom()">加入</button>
            <button class="btn" onclick="backToMenu()">返回</button>
        </div>
        
        <!-- 等待房间界面 -->
        <div id="waitPage" class="hidden">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2>房间号</h2>
                <div style="font-size: 48px; font-weight: bold; color: #48bb78; letter-spacing: 10px;" id="roomCodeDisplay">ABC123</div>
            </div>
            
            <div style="background: #f7fafc; padding: 15px; border-radius: 10px; margin-bottom: 20px; word-break: break-all;" id="shareLink">
                正在生成链接...
            </div>
            <button class="btn btn-green" onclick="copyLink()">📋 复制链接发给好友</button>
            
            <h3 style="margin-top: 30px;">👥 玩家列表</h3>
            <div id="playerList"></div>
            
            <button id="readyBtn" class="btn btn-green" onclick="toggleReady()">准备游戏</button>
            <button class="btn" onclick="leaveRoom()">离开房间</button>
        </div>
        
        <!-- 游戏界面 -->
        <div id="gamePage" class="hidden">
            <h2 style="text-align: center; color: #48bb78;">🎮 游戏开始！</h2>
            <p style="text-align: center; font-size: 20px;">三人已准备，游戏马上开始</p>
            <button class="btn" onclick="leaveGame()">退出</button>
        </div>
    </div>

    <script>
        // ==================== 数据管理 ====================
        let currentRoom = null;
        let currentPlayer = null;
        let isReady = false;
        
        // 获取房间数据
        function getRoom(roomId) {
            const data = localStorage.getItem('room_' + roomId);
            return data ? JSON.parse(data) : null;
        }
        
        // 保存房间数据
        function saveRoom(roomId, data) {
            localStorage.setItem('room_' + roomId, JSON.stringify(data));
        }
        
        // ==================== 创建房间 ====================
        function createRoom() {
            // 生成6位房间号
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            
            // 创建房间数据
            const roomData = {
                id: code,
                players: [
                    { num: 1, name: '玩家1', ready: false }
                ],
                created: Date.now()
            };
            saveRoom(code, roomData);
            
            // 设置当前玩家
            currentRoom = code;
            currentPlayer = 1;
            
            // 生成分享链接
            const link = window.location.href.split('?')[0] + '?room=' + code;
            
            // 更新UI
            document.getElementById('roomCodeDisplay').innerText = code;
            document.getElementById('shareLink').innerText = link;
            
            // **直接进入等待房间，不经过创建房间界面**
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('waitPage').classList.remove('hidden');
            
            // 刷新玩家列表
            updatePlayerList();
        }
        
        // ==================== 加入房间 ====================
        function showJoin() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('joinPage').classList.remove('hidden');
            
            // 从URL获取房间号
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room) {
                document.getElementById('roomCodeInput').value = room;
            }
        }
        
        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value.toUpperCase();
            if (code.length !== 6) {
                alert('请输入6位房间号');
                return;
            }
            
            let roomData = getRoom(code);
            if (!roomData) {
                alert('房间不存在，请检查房间号');
                return;
            }
            
            // 检查房间是否已满
            if (roomData.players.length >= 3) {
                alert('房间已满！');
                return;
            }
            
            // 获取可用的玩家编号
            let playerNum = 2;
            if (roomData.players.length === 2) playerNum = 3;
            
            // 添加玩家
            roomData.players.push({
                num: playerNum,
                name: '玩家' + playerNum,
                ready: false
            });
            saveRoom(code, roomData);
            
            // 设置当前玩家
            currentRoom = code;
            currentPlayer = playerNum;
            
            // 进入等待房间
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('waitPage').classList.remove('hidden');
            document.getElementById('roomCodeDisplay').innerText = code;
            
            // 生成分享链接（方便转发）
            const link = window.location.href.split('?')[0] + '?room=' + code;
            document.getElementById('shareLink').innerText = link;
            
            // 刷新玩家列表
            updatePlayerList();
        }
        
        // ==================== 等待房间 ====================
        function updatePlayerList() {
            const roomData = getRoom(currentRoom);
            if (!roomData) return;
            
            let html = '';
            
            // 显示玩家1-3
            for (let i = 1; i <= 3; i++) {
                const player = roomData.players.find(p => p.num === i);
                
                if (player) {
                    let status = player.ready ? '✓ 已准备' : '⏳ 准备中';
                    let isYou = (player.num === currentPlayer) ? ' (你)' : '';
                    html += `<div class="player-item">👤 ${player.name}${isYou} - ${status}</div>`;
                } else {
                    html += `<div class="player-empty">👤 等待玩家加入...</div>`;
                }
            }
            
            document.getElementById('playerList').innerHTML = html;
            
            // 更新准备按钮状态
            const me = roomData.players.find(p => p.num === currentPlayer);
            if (me) {
                const btn = document.getElementById('readyBtn');
                if (me.ready) {
                    btn.innerText = '取消准备';
                    btn.style.background = '#f56565';
                } else {
                    btn.innerText = '准备游戏';
                    btn.style.background = '#48bb78';
                }
            }
            
            // 检查是否三人全部准备
            if (roomData.players.length === 3 && roomData.players.every(p => p.ready)) {
                setTimeout(() => {
                    document.getElementById('waitPage').classList.add('hidden');
                    document.getElementById('gamePage').classList.remove('hidden');
                }, 1000);
            }
        }
        
        // 准备/取消准备
        function toggleReady() {
            const roomData = getRoom(currentRoom);
            if (!roomData) return;
            
            const me = roomData.players.find(p => p.num === currentPlayer);
            if (me) {
                me.ready = !me.ready;
                saveRoom(currentRoom, roomData);
                updatePlayerList();
            }
        }
        
        // ==================== 工具函数 ====================
        function copyLink() {
            const link = document.getElementById('shareLink').innerText;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ 链接已复制！发送给好友吧！');
            });
        }
        
        function backToMenu() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('waitPage').classList.add('hidden');
            document.getElementById('gamePage').classList.add('hidden');
        }
        
        function leaveRoom() {
            const roomData = getRoom(currentRoom);
            if (roomData) {
                // 移除当前玩家
                roomData.players = roomData.players.filter(p => p.num !== currentPlayer);
                
                if (roomData.players.length === 0) {
                    localStorage.removeItem('room_' + currentRoom);
                } else {
                    saveRoom(currentRoom, roomData);
                }
            }
            backToMenu();
        }
        
        function leaveGame() {
            leaveRoom();
        }
        
        // ==================== 定时刷新 ====================
        setInterval(() => {
            if (currentRoom && !document.getElementById('waitPage').classList.contains('hidden')) {
                updatePlayerList();
            }
        }, 1000);
        
        // ==================== 页面加载 ====================
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room) {
                document.getElementById('roomCodeInput').value = room;
                showJoin();
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三人炸飞机</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            padding: 20px;
            color: white;
        }
        .box {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            color: #333;
        }
        h1 { text-align: center; color: #4a5568; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .btn:hover { background: #3182ce; }
        .btn-green { background: #48bb78; }
        .btn-green:hover { background: #38a169; }
        .room-code {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #48bb78;
            letter-spacing: 10px;
            margin: 20px 0;
        }
        .hidden { display: none; }
        input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✈️ 三人炸飞机</h1>
        
        <!-- 主菜单 -->
        <div id="menu">
            <button class="btn btn-green" onclick="showCreate()">创建房间</button>
            <button class="btn" onclick="showJoin()">加入房间</button>
        </div>
        
        <!-- 创建房间 -->
        <div id="createPage" class="hidden">
            <h2 style="text-align: center;">房间号</h2>
            <div id="roomCodeDisplay" class="room-code">ABC123</div>
            <div style="background: #f7fafc; padding: 15px; border-radius: 10px; word-break: break-all;" id="shareLink">
                https://example.com?room=ABC123
            </div>
            <button class="btn btn-green" onclick="copyLink()">复制链接发给好友</button>
            <button class="btn" onclick="backToMenu()">返回</button>
        </div>
        
        <!-- 加入房间 -->
        <div id="joinPage" class="hidden">
            <h2 style="text-align: center;">加入房间</h2>
            <input type="text" id="roomCodeInput" placeholder="输入6位房间号" maxlength="6">
            <button class="btn btn-green" onclick="joinRoom()">加入</button>
            <button class="btn" onclick="backToMenu()">返回</button>
        </div>
        
        <!-- 等待房间 -->
        <div id="waitPage" class="hidden">
            <h2 style="text-align: center;">房间 <span id="currentRoom" style="color: #48bb78;">ABC123</span></h2>
            <div id="playerList" style="margin: 20px 0;"></div>
            <button id="readyBtn" class="btn btn-green" onclick="toggleReady()">准备游戏</button>
            <button class="btn" onclick="leaveRoom()">离开</button>
        </div>
        
        <!-- 游戏界面 -->
        <div id="gamePage" class="hidden">
            <h2 style="text-align: center; color: #48bb78;">🎮 游戏开始！</h2>
            <p style="text-align: center; font-size: 20px;">三人已准备，游戏马上开始</p>
            <button class="btn" onclick="leaveGame()">退出</button>
        </div>
    </div>

    <script>
        // 房间数据
        let currentRoom = null;
        let currentPlayer = null;
        let isReady = false;
        
        // 获取房间数据
        function getRoom(roomId) {
            const data = localStorage.getItem('room_' + roomId);
            return data ? JSON.parse(data) : null;
        }
        
        // 保存房间数据
        function saveRoom(roomId, data) {
            localStorage.setItem('room_' + roomId, JSON.stringify(data));
        }
        
        // 显示创建房间
        function showCreate() {
            // 生成6位房间号
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            
            // 创建房间
            currentRoom = code;
            currentPlayer = 1;
            
            const roomData = {
                id: code,
                players: [
                    { num: 1, name: '玩家1', ready: false }
                ],
                created: Date.now()
            };
            saveRoom(code, roomData);
            
            // 更新界面
            document.getElementById('roomCodeDisplay').innerText = code;
            const link = window.location.href.split('?')[0] + '?room=' + code;
            document.getElementById('shareLink').innerText = link;
            
            // 切换页面
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('createPage').classList.remove('hidden');
        }
        
        // 显示加入房间
        function showJoin() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('joinPage').classList.remove('hidden');
            
            // 从URL获取房间号
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room) {
                document.getElementById('roomCodeInput').value = room;
            }
        }
        
        // 加入房间
        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value.toUpperCase();
            if (code.length !== 6) {
                alert('请输入6位房间号');
                return;
            }
            
            let roomData = getRoom(code);
            if (!roomData) {
                // 房间不存在，创建新房间
                roomData = {
                    id: code,
                    players: [
                        { num: 1, name: '玩家1', ready: false }
                    ],
                    created: Date.now()
                };
            }
            
            // 获取玩家编号
            let playerNum = 2;
            if (roomData.players.length >= 2) playerNum = 3;
            
            if (roomData.players.length >= 3) {
                alert('房间已满！');
                return;
            }
            
            // 添加玩家
            roomData.players.push({
                num: playerNum,
                name: '玩家' + playerNum,
                ready: false
            });
            
            saveRoom(code, roomData);
            
            currentRoom = code;
            currentPlayer = playerNum;
            
            // 进入等待房间
            showWaitingRoom();
        }
        
        // 显示等待房间
        function showWaitingRoom() {
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('waitPage').classList.remove('hidden');
            document.getElementById('currentRoom').innerText = currentRoom;
            
            updatePlayerList();
        }
        
        // 更新玩家列表
        function updatePlayerList() {
            const roomData = getRoom(currentRoom);
            if (!roomData) return;
            
            let html = '';
            for (let i = 1; i <= 3; i++) {
                const player = roomData.players.find(p => p.num === i);
                if (player) {
                    html += `<div style="padding: 15px; background: #f7fafc; margin: 5px 0; border-radius: 10px; border-left: 5px solid #48bb78;">
                        👤 ${player.name} ${player.num === currentPlayer ? '(你)' : ''} - ${player.ready ? '✓ 已准备' : '⏳ 准备中'}
                    </div>`;
                } else {
                    html += `<div style="padding: 15px; background: #f7fafc; margin: 5px 0; border-radius: 10px; opacity: 0.5;">
                        👤 等待玩家...
                    </div>`;
                }
            }
            document.getElementById('playerList').innerHTML = html;
            
            // 检查是否三人全部准备
            if (roomData.players.length === 3 && roomData.players.every(p => p.ready)) {
                setTimeout(() => {
                    document.getElementById('waitPage').classList.add('hidden');
                    document.getElementById('gamePage').classList.remove('hidden');
                }, 1000);
            }
        }
        
        // 准备/取消准备
        function toggleReady() {
            isReady = !isReady;
            const btn = document.getElementById('readyBtn');
            
            const roomData = getRoom(currentRoom);
            if (roomData) {
                const me = roomData.players.find(p => p.num === currentPlayer);
                if (me) {
                    me.ready = isReady;
                }
                saveRoom(currentRoom, roomData);
            }
            
            btn.innerText = isReady ? '取消准备' : '准备游戏';
            btn.style.background = isReady ? '#f56565' : '#48bb78';
            
            updatePlayerList();
        }
        
        // 复制链接
        function copyLink() {
            const link = document.getElementById('shareLink').innerText;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ 链接已复制！发送给好友吧！');
            });
        }
        
        // 返回主菜单
        function backToMenu() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('createPage').classList.add('hidden');
            document.getElementById('joinPage').classList.add('hidden');
            document.getElementById('waitPage').classList.add('hidden');
            document.getElementById('gamePage').classList.add('hidden');
        }
        
        // 离开房间
        function leaveRoom() {
            const roomData = getRoom(currentRoom);
            if (roomData) {
                roomData.players = roomData.players.filter(p => p.num !== currentPlayer);
                if (roomData.players.length === 0) {
                    localStorage.removeItem('room_' + currentRoom);
                } else {
                    saveRoom(currentRoom, roomData);
                }
            }
            backToMenu();
        }
        
        // 离开游戏
        function leaveGame() {
            leaveRoom();
        }
        
        // 定时刷新玩家列表
        setInterval(() => {
            if (currentRoom && !document.getElementById('waitPage').classList.contains('hidden')) {
                updatePlayerList();
            }
        }, 1000);
        
        // 页面加载
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room) {
                document.getElementById('roomCodeInput').value = room;
                showJoin();
            }
        };
    </script>
</body>
</html>

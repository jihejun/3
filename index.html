<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三人炸飞机 · 实时对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1e2c 0%, #2d3748 100%);
            min-height: 100vh;
            padding: 12px;
            color: #e2e8f0;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(26, 32, 44, 0.95);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid #4a5568;
        }
        
        h1 {
            color: #e2e8f0;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .room-header {
            background: #2d3748;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #4a5568;
        }
        
        .room-code-box {
            background: #1a1e2c;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 10px;
        }
        
        .room-code {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 12px;
            color: #68d391;
            font-family: monospace;
            text-shadow: 0 0 10px #48bb78;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4299e1, #3182ce);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48bb78, #38a169);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ed8936, #dd6b20);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        
        .player-card {
            background: #2d3748;
            padding: 16px 8px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #4a5568;
        }
        
        .player-card.active {
            border-color: #48bb78;
            background: #22543d;
            box-shadow: 0 0 15px #48bb78;
        }
        
        .player-card.ready {
            border-color: #48bb78;
            background: #276749;
        }
        
        .player-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .player-status {
            font-size: 14px;
            color: #a0aec0;
        }
        
        .hidden {
            display: none !important;
        }
        
        .active {
            display: block;
        }
        
        .share-section {
            margin-top: 20px;
            padding: 20px;
            background: #2d3748;
            border-radius: 16px;
        }
        
        .share-link {
            background: #1a1e2c;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            font-family: monospace;
            margin: 15px 0;
            border: 1px dashed #48bb78;
            color: #a0aec0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ 三人炸飞机 · 实时对战</h1>
        
        <!-- 主菜单 -->
        <div id="menu">
            <button class="btn btn-primary" onclick="showCreateRoom()">创建房间</button>
            <button class="btn btn-success" onclick="showJoinRoom()">加入房间</button>
        </div>
        
        <!-- 创建房间界面 -->
        <div id="createRoom" class="hidden">
            <div class="room-header">
                <h2 style="text-align: center; margin-bottom: 15px;">🎮 创建房间</h2>
                <div class="room-code-box">
                    <div style="color: #a0aec0; margin-bottom: 5px;">房间号</div>
                    <div id="roomCodeDisplay" class="room-code">ABC123</div>
                </div>
            </div>
            
            <div class="share-section">
                <h3 style="margin-bottom: 15px;">📱 邀请好友</h3>
                <div id="shareLink" class="share-link">正在生成链接...</div>
                <button class="btn btn-success" onclick="copyShareLink()">复制链接发送给微信好友</button>
            </div>
            
            <div class="players-grid">
                <div class="player-card active">
                    <div class="player-name">👤 玩家1 (你)</div>
                    <div class="player-status">房主</div>
                </div>
                <div class="player-card">
                    <div class="player-name">👤 玩家2</div>
                    <div class="player-status">等待加入...</div>
                </div>
                <div class="player-card">
                    <div class="player-name">👤 玩家3</div>
                    <div class="player-status">等待加入...</div>
                </div>
            </div>
            
            <button class="btn btn-warning" onclick="backToMenu()">返回</button>
        </div>
        
        <!-- 加入房间界面 -->
        <div id="joinRoom" class="hidden">
            <div class="room-header">
                <h2 style="text-align: center; margin-bottom: 20px;">🔑 加入房间</h2>
                <input type="text" id="joinRoomCode" placeholder="输入6位房间号" 
                       style="width: 100%; padding: 18px; font-size: 24px; text-align: center; 
                              background: #1a1e2c; border: 2px solid #4a5568; border-radius: 12px;
                              color: white; letter-spacing: 4px;" 
                       maxlength="6" autocomplete="off">
            </div>
            
            <button class="btn btn-success" onclick="joinRoom()">加入房间</button>
            <button class="btn btn-warning" onclick="backToMenu()">返回</button>
        </div>
        
        <!-- 等待房间界面 -->
        <div id="waitingRoom" class="hidden">
            <div class="room-header">
                <h2 style="text-align: center;">🏠 房间 <span id="currentRoomCode" style="color: #68d391;">ABC123</span></h2>
            </div>
            
            <div class="players-grid" id="waitingPlayersList"></div>
            
            <button id="readyButton" class="btn btn-success" onclick="toggleReady()">准备游戏</button>
            <button class="btn btn-warning" onclick="leaveRoom()">离开房间</button>
        </div>
        
        <!-- 游戏界面（简化版） -->
        <div id="gameInterface" class="hidden">
            <div style="text-align: center; padding: 40px; background: #2d3748; border-radius: 16px;">
                <h2 style="color: #48bb78; margin-bottom: 20px;">🎮 游戏开始！</h2>
                <p style="margin-bottom: 30px; font-size: 18px;">完整对战功能开发中...</p>
                <button class="btn btn-warning" onclick="leaveGame()">退出游戏</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 房间状态管理 ====================
        const ROOM_STORAGE_KEY = 'plane_game_rooms';
        
        function getRooms() {
            const rooms = localStorage.getItem(ROOM_STORAGE_KEY);
            return rooms ? JSON.parse(rooms) : {};
        }
        
        function saveRoom(roomId, roomData) {
            const rooms = getRooms();
            rooms[roomId] = {
                ...roomData,
                lastUpdate: Date.now()
            };
            localStorage.setItem(ROOM_STORAGE_KEY, JSON.stringify(rooms));
        }
        
        function getRoom(roomId) {
            const rooms = getRooms();
            return rooms[roomId];
        }
        
        function getNextPlayerNumber(roomId) {
            const room = getRoom(roomId);
            if (!room) return 1;
            if (!room.players) return 1;
            
            const usedNumbers = room.players.map(p => p.num);
            for (let i = 1; i <= 3; i++) {
                if (!usedNumbers.includes(i)) {
                    return i;
                }
            }
            return null;
        }

        // ==================== 全局变量 ====================
        let currentRoomId = null;
        let currentPlayerNum = null;
        let roomPlayers = [];
        let isPlayerReady = false;
        
        // ==================== 定期同步 ====================
        setInterval(() => {
            if (currentRoomId) {
                const room = getRoom(currentRoomId);
                if (room && room.players) {
                    roomPlayers = room.players;
                    if (!document.getElementById('waitingRoom').classList.contains('hidden')) {
                        updateWaitingPlayersList();
                    }
                }
            }
        }, 1000);
        
        // ==================== 界面函数 ====================
        function showCreateRoom() {
            // 生成6位房间号
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let roomCode = '';
            for (let i = 0; i < 6; i++) {
                roomCode += chars[Math.floor(Math.random() * chars.length)];
            }
            
            currentRoomId = roomCode;
            currentPlayerNum = 1;
            
            // 初始化房间
            const roomData = {
                players: [
                    { num: 1, name: '玩家1', ready: false, isYou: true }
                ],
                created: Date.now(),
                gameState: 'waiting'
            };
            saveRoom(roomCode, roomData);
            roomPlayers = roomData.players;
            
            // 更新UI
            document.getElementById('roomCodeDisplay').textContent = roomCode;
            const shareUrl = window.location.href.split('?')[0] + '?room=' + roomCode;
            document.getElementById('shareLink').textContent = shareUrl;
            
            // 切换界面
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('createRoom').classList.remove('hidden');
        }
        
        function showJoinRoom() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('joinRoom').classList.remove('hidden');
        }
        
        function joinRoom() {
            const roomCode = document.getElementById('joinRoomCode').value.toUpperCase();
            if (roomCode.length !== 6) {
                alert('请输入6位房间号');
                return;
            }
            
            let room = getRoom(roomCode);
            
            if (!room) {
                // 房间不存在，自动创建
                room = {
                    players: [
                        { num: 1, name: '玩家1', ready: false, isYou: false }
                    ],
                    created: Date.now(),
                    gameState: 'waiting'
                };
            }
            
            // 获取玩家编号
            let playerNum = getNextPlayerNumber(roomCode);
            if (!playerNum) {
                alert('房间已满！');
                return;
            }
            
            currentRoomId = roomCode;
            currentPlayerNum = playerNum;
            
            // 添加新玩家
            if (!room.players) room.players = [];
            room.players.push({
                num: playerNum,
                name: '玩家' + playerNum,
                ready: false,
                isYou: true
            });
            
            saveRoom(roomCode, room);
            roomPlayers = room.players;
            
            showWaitingRoom();
        }
        
        function showWaitingRoom() {
            document.getElementById('joinRoom').classList.add('hidden');
            document.getElementById('waitingRoom').classList.remove('hidden');
            document.getElementById('currentRoomCode').textContent = currentRoomId;
            
            updateWaitingPlayersList();
        }
        
        function updateWaitingPlayersList() {
            const list = document.getElementById('waitingPlayersList');
            if (!list) return;
            
            list.innerHTML = '';
            
            const room = getRoom(currentRoomId);
            if (room && room.players) {
                roomPlayers = room.players;
            }
            
            // 显示3个玩家位置
            for (let i = 1; i <= 3; i++) {
                const player = roomPlayers ? roomPlayers.find(p => p.num === i) : null;
                
                if (player) {
                    const card = document.createElement('div');
                    card.className = 'player-card' + (player.ready ? ' ready' : '') + (player.isYou ? ' active' : '');
                    card.innerHTML = `
                        <div class="player-name">👤 ${player.name} ${player.isYou ? '(你)' : ''}</div>
                        <div class="player-status">${player.ready ? '✓ 已准备' : '⏳ 准备中...'}</div>
                    `;
                    list.appendChild(card);
                } else {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <div class="player-name">👤 等待玩家...</div>
                        <div class="player-status">⏳ 等待加入</div>
                    `;
                    list.appendChild(card);
                }
            }
        }
        
        function toggleReady() {
            isPlayerReady = !isPlayerReady;
            const btn = document.getElementById('readyButton');
            
            const room = getRoom(currentRoomId);
            if (room && room.players) {
                const me = room.players.find(p => p.num === currentPlayerNum);
                if (me) {
                    me.ready = isPlayerReady;
                }
                saveRoom(currentRoomId, room);
            }
            
            btn.textContent = isPlayerReady ? '取消准备' : '准备游戏';
            btn.style.background = isPlayerReady ? '#f56565' : '#48bb78';
            
            updateWaitingPlayersList();
            
            // 检查是否满3人且全部准备
            const room = getRoom(currentRoomId);
            if (room && room.players && room.players.length === 3) {
                const allReady = room.players.every(p => p.ready);
                if (allReady) {
                    setTimeout(() => {
                        startGame();
                    }, 1000);
                }
            }
        }
        
        function startGame() {
            document.getElementById('waitingRoom').classList.add('hidden');
            document.getElementById('gameInterface').classList.remove('hidden');
        }
        
        function copyShareLink() {
            const link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ 链接已复制！\n\n发送给2位微信好友，他们点击链接就能加入游戏！');
            });
        }
        
        function backToMenu() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('createRoom').classList.add('hidden');
            document.getElementById('joinRoom').classList.add('hidden');
            document.getElementById('waitingRoom').classList.add('hidden');
            document.getElementById('gameInterface').classList.add('hidden');
        }
        
        function leaveRoom() {
            // 从房间移除自己
            const room = getRoom(currentRoomId);
            if (room && room.players) {
                room.players = room.players.filter(p => p.num !== currentPlayerNum);
                
                if (room.players.length === 0) {
                    const rooms = getRooms();
                    delete rooms[currentRoomId];
                    localStorage.setItem(ROOM_STORAGE_KEY, JSON.stringify(rooms));
                } else {
                    saveRoom(currentRoomId, room);
                }
            }
            
            backToMenu();
        }
        
        function leaveGame() {
            leaveRoom();
        }
        
        // 页面加载
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            
            if (roomParam) {
                document.getElementById('joinRoomCode').value = roomParam;
                showJoinRoom();
            }
        };
    </script>
</body>
</html>
